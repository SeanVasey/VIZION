name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch — the enablement diagnostic (docs/runbooks/ci-enablement.md):
  # after fixing the repo-level Actions block, "Run workflow" here proves runs
  # actually start.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        # The tree was brought fully Prettier-clean in one mechanical commit
        # (audit 04 fmt-01); this step keeps it from silently re-drifting —
        # 128 files had drifted with nothing arresting it.
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate icons
        run: npm run generate:icons

      - name: The generated tree is committed and reproducible
        # The step above only proved the script does not throw. THIS is what
        # makes it a check: the committed art must be what a fresh run produces,
        # so a generator change that alters output — or silently stops writing a
        # file — fails here instead of shipping. (A comment in generate-icons.mjs
        # used to claim a unit test covered this. None ever did; a test cannot
        # re-run a generator that writes to fixed paths without clobbering the
        # working tree.)
        #
        # `git status --porcelain`, not `git diff --exit-code`: it also catches a
        # NEW untracked output, which a diff of tracked files cannot see. It does
        # NOT catch an ORPHAN — a file the generator stopped writing but that
        # stays committed — so removing an output still needs an explicit
        # `git rm` in the same change.
        #
        # This makes sharp/libvips byte output a CI contract. Safe here: the
        # lockfile pins both, and substantial generator edits have left the PNG
        # bytes untouched. If cross-platform drift ever appears, narrow the byte
        # check to app-icon.svg and compare the PNGs by decoded-pixel hash.
        run: |
          DRIFT="$(git status --porcelain -- public/icons public/splash public/favicon.ico)"
          if [ -n "$DRIFT" ]; then
            echo "::error::The committed icon tree differs from a fresh \`npm run generate:icons\`. Regenerate and commit."
            echo "$DRIFT"
            git --no-pager diff --stat -- public/icons public/splash public/favicon.ico
            exit 1
          fi

      - name: Unit tests
        run: npm run test

      - name: Build (compiles the service worker via prebuild)
        run: npm run build

      - name: Install Playwright browsers
        # Just the two engines the configured projects use (mobile-safari →
        # WebKit, mobile-chrome → Chromium); a bare `install` adds Firefox too.
        run: npx playwright install --with-deps webkit chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload e2e traces on failure
        # Retry traces (`trace: on-first-retry`) and the report otherwise die
        # with the runner — a red e2e leg was undebuggable from the log alone
        # (audit 04 ci-05).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Security audit (production dependencies)
        # Audit what actually ships. Dev/build tooling (esbuild via vite/vitest)
        # carries advisories that only affect a running dev server / Deno, never
        # the deployed runtime; the full tree is gated by the next step.
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (full tree, gated)
        # NOT `npm audit || true`. That printed 14 high entries and passed
        # regardless, so a genuinely new advisory would have scrolled past among
        # the known ones. This fails on any advisory that is not a documented,
        # SELF-VERIFYING exemption — see scripts/check-audit.mjs.
        run: npm run audit:check
